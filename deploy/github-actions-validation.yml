name: Validate static site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/build.py --check
      - run: python3 tools/check.py
      - run: node --check assets/js/desktop.js && node --check assets/js/i18n.js
